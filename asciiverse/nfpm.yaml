# System packages (.deb, .rpm, .apk, Arch) for one tty.cards game, built by
# nfpm from the same static binary as its av archive. The release workflow
# fills in @NAME@ (the game's binary and package) and @SUMMARY@ for each
# game, sets VERSION, RELEASE and ARCH, and puts the binary at stage/@NAME@.
#
# No .desktop file on purpose: av is the one place titles are started from,
# so Asciiverse packages never add menu entries (asciiverse/CLAUDE.md).
name: @NAME@
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/tty-cards
license: MIT
description: |
  @SUMMARY@
  Played in the terminal against computer players, from Pieczasz's
  tty.cards, packaged by Asciiverse.
contents:
  - src: stage/@NAME@
    dst: /usr/bin/@NAME@
    file_info: { mode: 0755 }
  - src: LICENSE
    dst: /usr/share/doc/@NAME@/copyright
    file_info: { mode: 0644 }
  - src: PATCHES.md
    dst: /usr/share/doc/@NAME@/PATCHES.md
    file_info: { mode: 0644 }
  - src: README.md
    dst: /usr/share/doc/@NAME@/README.md
    file_info: { mode: 0644 }
